<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eventi — Milano Cortina</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .bottom-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #0b1220;
      color: #fff;
      padding: 0.65rem 1rem;
      text-align: center;
      z-index: 1000;
    }
    .bottom-banner a {
      color: #9fb8ff;
      margin: 0 0.5rem;
      text-decoration: none;
    }
    .bottom-banner a:hover { color: #fff; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-wrap">
        <a class="brand" href="index.html">
          <img src="https://altimanix.github.io/TPS/logo.png" alt="Logo" class="site-logo">
          <span class="brand-text">Milano Cortina Eventi</span>
        </a>
      </div>
      <button class="nav-toggle" aria-label="Apri menu"><span></span><span></span><span></span></button>
      <nav class="main-nav" aria-expanded="false">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a class="active" href="eventi.html">Eventi</a></li>
          <li><a href="vip.html">Ospiti</a></li>
          <li><a href="#contatti">Contatti</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Tutti gli eventi</h2>

    <div class="filters">
      <input id="searchInput" type="search" placeholder="Cerca per titolo o luogo..." aria-label="Cerca eventi">
      <select id="categoriaFilter" aria-label="Filtro categoria">
        <option value="">Tutte le categorie</option>
      </select>
      <input id="dataFilter" type="date" aria-label="Filtro data">
    </div>

    <div id="eventsGrid" class="cards-grid" style="margin-top:1rem"></div>
  </main>

  <div class="bottom-banner">
    <a href="index.html">Home</a>
    <a href="eventi.html">Eventi</a>
    <a href="vip.html">Ospiti</a>
    <a href="prenotazione.html">Prenota</a>
    <a href="#contatti">Contatti</a>
  </div>

  <script src="scripts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initEventsPage();
    });
  </script>
</body>
</html>
