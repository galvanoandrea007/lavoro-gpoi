<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eventi — Milano Cortina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-wrap">
        <a class="brand" href="index.html">
          <img src="https://altimanix.github.io/TPS/logo.png" alt="Logo" class="site-logo">
          <span class="brand-text">Milano Cortina Eventi</span>
        </a>
      </div>
      <button id="navToggle2" class="nav-toggle" aria-label="Apri menu"><span></span><span></span><span></span></button>
      <nav id="mainNav2" class="main-nav" aria-expanded="false">

        </ul>

  <main>
    <section class="container">
      <h2>Tutti gli eventi</h2>

      <div class="filters">
        <input id="searchInput" type="search" placeholder="Cerca per titolo o luogo..." aria-label="Cerca eventi">
        <select id="categoriaFilter" aria-label="Filtro categoria">
          <option value="">Tutte le categorie</option>
        </select>
        <input id="dataFilter" type="date" aria-label="Filtro data">
      </div>

      <div id="eventsGrid" class="cards-grid" style="margin-top:1rem"></div>
    </section>
  </main>

  <div class="bottom-banner">
    <div class="container">
      <nav class="bottom-links" aria-label="Link rapidi">
        <a href="index.html">Home</a>
        <a href="eventi.html">Eventi</a>

  <footer class="site-footer">

      <p>&copy; 2025 Milano Cortina Eventi</p>
    </div>

  <script src="scripts.js">
    document.addEventListener('DOMContentLoaded', function () {
      window.initEventsPage?.();
