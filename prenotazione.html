<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prenotazione — Milano Cortina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-wrap">
        <a class="brand" href="index.html">
          <img src="https://altimanix.github.io/TPS/logo.png" alt="Logo" class="site-logo">
          <span class="brand-text">Milano Cortina Eventi</span>
        </a>
      </div>
      <button id="navToggle4" class="nav-toggle" aria-label="Apri menu"><span></span><span></span><span></span></button>
      <nav id="mainNav4" class="main-nav" aria-expanded="false">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="eventi.html">Eventi</a></li>
          <li><a href="vip.html">Ospiti</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="container booking-section">
      <h2>Prenota il tuo posto</h2>

      <div id="selectedEventBox" class="card"></div>

      <form id="bookingForm" class="booking-form">
        <label>Nome e Cognome
          <input id="bookName" required type="text" placeholder="Mario Rossi">
        </label>

        <label>Email
          <input id="bookEmail" required type="email" placeholder="mario@example.com">
        </label>

        <label>Telefono
          <input id="bookPhone" required type="tel" placeholder="+39 333 1234567">
        </label>

        <label>Quantità biglietti
          <input id="bookQty" required type="number" min="1" max="10" value="1">
        </label>

        <button type="submit" class="btn">Conferma prenotazione</button>
      </form>

      <div id="bookingMessage" class="mt-1" aria-live="polite"></div>
    </section>
  </main>

  <div class="bottom-banner">
    <div class="container">
      <nav class="bottom-links" aria-label="Link rapidi">
        <a href="index.html">Home</a>
        <a href="eventi.html">Eventi</a>
        <a href="vip.html">Ospiti</a>
        <a href="#contatti">Contatti</a>
      </nav>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 Milano Cortina Eventi</p>
    </div>
  </footer>

  <script src="scripts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.initBookingPage?.();
    });
  </script>
</body>
</html>
